name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

  build:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project Touch-Tab.xcodeproj \
            -target Touch-Tab \
            -configuration Release \
            SYMROOT="$PWD/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build

      - name: Smoke test
        run: |
          # The app must start and keep running without Accessibility permission.
          APP=build/Release/Touch-Tab.app
          "$APP/Contents/MacOS/Touch-Tab" &
          PID=$!
          sleep 10
          kill -0 "$PID"
          kill "$PID"

      - name: Package
        run: |
          APP=build/Release/Touch-Tab.app
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/Touch-Tab"
          # Disk image with a shortcut to Applications so the app can be dragged there.
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Touch-Tab -srcfolder dmg -fs HFS+ -format UDZO Touch-Tab.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Touch-Tab
          path: Touch-Tab.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Touch-Tab.dmg --title "$GITHUB_REF_NAME" --generate-notes
