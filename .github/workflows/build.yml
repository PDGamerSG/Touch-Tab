name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project Touch-Tab.xcodeproj \
            -target Touch-Tab \
            -configuration Release \
            SYMROOT="$PWD/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build

      - name: Package
        run: |
          APP=build/Release/Touch-Tab.app
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/Touch-Tab"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Touch-Tab.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Touch-Tab
          path: Touch-Tab.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Touch-Tab.zip --title "$GITHUB_REF_NAME" --generate-notes
